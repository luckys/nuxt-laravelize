packages:
  - 'packages/*'
  - 'playground'

allowBuilds:
  '@google/genai': set this to true or false
  '@mongodb-js/zstd': set this to true or false
  '@parcel/watcher': true
  better-sqlite3: set this to true or false
  core-js-pure: set this to true or false
  esbuild: true
  msgpackr-extract: set this to true or false
  node-liblzma: set this to true or false
  protobufjs: set this to true or false
  unrs-resolver: true
